<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <title>3D Island Drive - SSC Islam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thaana:wght@700&display=swap" rel="stylesheet">

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0a5e9e; touch-action: none; font-family: 'Faruma', 'MV Boli', 'Noto Sans Thaana', sans-serif !important; }
    canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1;}
    
    #ui-container { position: absolute; top: 15px; width: 100%; color: white; text-shadow: 2px 2px 4px black; z-index: 100; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
    #trophy { background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 20px; font-size: 18px; font-weight: bold; margin-bottom: 10px; color: gold; border: 1px solid gold;}
    #question-box { background: rgba(255,255,255,0.95); color: black; padding: 15px; border-radius: 10px; font-size: 24px; font-weight: bold; text-align: center; border: 3px solid #333; text-shadow: none; direction: rtl; width: 85%; max-width: 600px; box-shadow: 0px 4px 8px rgba(0,0,0,0.3); transition: background 0.3s, color 0.3s; }
    
    #loading-screen { position: absolute; width: 100%; height: 100%; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; color: white; font-size: 24px; text-align: center; padding: 20px; }
    #start-btn { display: none; margin-top: 20px; padding: 15px 50px; font-size: 24px; background: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: inherit; box-shadow: 0px 5px 15px rgba(0,255,0,0.4); }
    
    #left-controls { position: absolute; bottom: 20px; left: 20px; z-index: 9999; display: none; flex-direction: row; gap: 8px; }
    .control-btn { padding: 12px 10px; font-size: 14px; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: Arial, sans-serif; box-shadow: 0px 4px 8px rgba(0,0,0,0.5); border: none; }
    #pause-btn { background: #e74c3c; border-bottom: 4px solid #c0392b; }
    #cam-btn { background: #3498db; border-bottom: 4px solid #2980b9; }
    #map-btn { background: #f39c12; border-bottom: 4px solid #d68910; } 
    
    #speed-container { position: absolute; bottom: 20px; right: 20px; z-index: 9999; display: none; flex-direction: column; align-items: center; background: rgba(0,0,0,0.7); padding: 15px 10px; border-radius: 20px; border: 2px solid #4CAF50; box-shadow: 0px 4px 8px rgba(0,0,0,0.5); }
    #speed-slider { -webkit-appearance: slider-vertical; appearance: slider-vertical; width: 30px; height: 160px; margin: 10px 0; cursor: pointer; accent-color: #4CAF50; }
    .speed-icon { font-size: 26px; }
    
    #tap-indicator { position: absolute; top: 60%; width: 100%; text-align: center; color: white; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px black; z-index: 50; animation: blink 1.5s infinite; pointer-events: none; display: none; }
    @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.2;} 100% {opacity: 1;} }

    #map-overlay { position: absolute; top: 15px; width: 100%; text-align: center; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px black; z-index: 100; display: none; pointer-events: none; }
    #map-overlay span { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 15px; border: 2px solid #3498db; }
    
    #toast-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(231, 76, 60, 0.95); color: white; font-size: 24px; font-weight: bold; padding: 20px 40px; border-radius: 15px; z-index: 999; display: none; text-align: center; border: 3px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.5); pointer-events: none;}

    /* Worksheet UI */
    #worksheet-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fdfbf7; z-index: 400; display: none; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; overflow-y: auto; font-family: inherit; }
    #ws-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    #ws-back-btn { background: #f39c12; color: white; padding: 12px 20px; border-radius: 10px; font-weight: bold; border: none; font-size: 18px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
    #ws-title { font-size: 26px; color: #2c3e50; font-weight: bold; }
    #ws-lives { font-size: 24px; letter-spacing: 2px; }
    #ws-question-box { background: white; padding: 25px; border-radius: 15px; font-size: 26px; font-weight: bold; text-align: center; width: 100%; max-width: 600px; box-shadow: 0 6px 12px rgba(0,0,0,0.1); margin-bottom: 25px; border: 3px solid #3498db; color: #2c3e50;}
    #ws-answers-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 600px; }
    .ws-answer-btn { background: #2ecc71; color: white; padding: 18px; border-radius: 10px; border: none; font-size: 22px; cursor: pointer; font-family: inherit; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: background 0.3s; text-align: right;}

    /* Booklet Study UI */
    #booklet-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #e8f4f8; z-index: 400; display: none; flex-direction: column; align-items: center; padding: 20px; box-sizing: border-box; overflow-y: auto; font-family: inherit; }
    #bk-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    #bk-back-btn { background: #3498db; color: white; padding: 12px 20px; border-radius: 10px; font-weight: bold; border: none; font-size: 18px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
    #bk-title { font-size: 26px; color: #2c3e50; font-weight: bold; }
    #bk-content { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 50px; }
    .qa-block { background: white; padding: 15px; border-radius: 10px; border: 2px solid #3498db; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: right; }
    .q-text { font-size: 22px; font-weight: bold; color: #e74c3c; margin-bottom: 8px; }
    .a-text { font-size: 20px; color: #2ecc71; font-weight: bold; }
  </style>
</head>
<body>

  <audio id="audio-engine" src="https://hussainsaamy.github.io/game-assets/sound.mp3" loop preload="auto" crossorigin="anonymous"></audio>
  <audio id="audio-bull" src="https://hussainsaamy.github.io/game-assets/bull.mp3" loop preload="auto" crossorigin="anonymous"></audio>

  <div id="loading-screen">
    <span id="load-text" style="color: #4CAF50; font-size: 30px;">Building 3D Atoll...</span>
    <button id="start-btn" onclick="openMap()">OPEN MAP</button>
  </div>

  <div id="map-overlay"><span>🗺️ Double-Tap to Play!</span></div>
  <div id="toast-msg">Complete the Worksheet 📝 first to unlock this Island!</div>

  <!-- Booklet Study Screen -->
  <div id="booklet-screen">
      <div id="bk-header" dir="ltr">
          <button id="bk-back-btn" onclick="closeBooklet()">✅ DONE READING</button>
          <div id="bk-title">Island 1 - Study Guide</div>
      </div>
      <div id="bk-content" dir="rtl">
      </div>
  </div>

  <!-- Worksheet Screen -->
  <div id="worksheet-screen">
      <div id="ws-header" dir="ltr">
          <button id="ws-back-btn" onclick="closeWorksheet()">🗺️ MAP</button>
          <div id="ws-title">Island 1</div>
          <div id="ws-lives">❤️❤️❤️</div>
      </div>
      <div id="ws-question-box">Question loads here</div>
      <div id="ws-answers-grid" id="answers-container"></div>
  </div>

  <div id="ui-container" style="display: none;">
    <div id="trophy" dir="ltr">🏆 Island <span id="island-counter">1 / 50</span></div>
    <div id="question-box">Loading...</div>
  </div>
  
  <div id="tap-indicator">Tap sides to steer.<br>Swipe middle to look around!</div>

  <div id="left-controls">
    <button id="map-btn" class="control-btn" onclick="returnToMap()" dir="ltr">🗺️ MAP</button>
    <button id="pause-btn" class="control-btn" onclick="togglePause()" dir="ltr">⏸ PAUSE</button>
    <button id="cam-btn" class="control-btn" onclick="toggleCamera()" dir="ltr">🎥 ACTION</button>
  </div>

  <div id="speed-container">
    <span class="speed-icon">🐰</span>
    <input type="range" id="speed-slider" min="0" max="2.5" step="0.1" value="1.0" orient="vertical" dir="ltr">
    <span class="speed-icon">🐢</span>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbydQNgQncy4isjzbMa-DlaaDAbt3TPFv39yYG0nA7p6oDn1a8DFXrSNRlDfAFd4FSUu/exec"; 

    let gameData = [];
    let islandStates = new Array(50).fill(0); 
    let readBooklets = new Array(50).fill(false);
    let appState = 'LOADING'; 

    let currentIsland = 0;
    let currentQuestion = 0;
    let gameStarted = false;
    let isPaused = false; 
    let isDriving = false; 
    let MAP_SIZE = 400, BOUNDARY = 190;
    let cameraMode = 0; 
    
    let activeSteering = 0; 
    let isLooking = false;
    let lookStartX = 0;
    let lookStartY = 0;
    let camAngleOffset = 0;
    let targetCamAngleOffset = 0;
    let camPitchOffset = 0;
    let targetCamPitchOffset = 0;

    let engineAudio = document.getElementById('audio-engine');
    let bullAudio = document.getElementById('audio-bull');
    
    const signColors = ["#1B5E20", "#0D47A1", "#B71C1C", "#4A148C", "#E65100", "#006064", "#212121"];
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); 
    const clock = new THREE.Clock();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 15000); 
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const gameGroup = new THREE.Group(); scene.add(gameGroup);
    const mapGroup = new THREE.Group(); scene.add(mapGroup);
    const mapPinsGroup = new THREE.Group(); mapGroup.add(mapPinsGroup);
    
    const signboardsArray = [], treesArray = [], bullsArray = [], mixers = [];
    let islandMapPositions = [];
    let flagHitboxes = []; 

    let lastTapTime = 0;
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enabled = false; 
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    
    // FIX: Lock map panning strictly to horizontal movement
    controls.screenSpacePanning = false;

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(100, 200, 100); scene.add(sun);

    const carGroup = new THREE.Group(); gameGroup.add(carGroup);
    const gltfLoader = new THREE.GLTFLoader();

    const towerMatRed = new THREE.MeshStandardMaterial({color: 0xcc0000, roughness: 0.8, flatShading: true});
    const towerMatWhite = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.8, flatShading: true});
    const towerEdgeMat = new THREE.LineBasicMaterial({ color: 0x222222, linewidth: 2 });
    const dishMat = new THREE.MeshStandardMaterial({color: 0x555555});

    function loadModel(url) { return new Promise(res => gltfLoader.load(url, res, undefined, () => res(null))); }

    async function initAssets() {
        try {
            const res = await fetch(`${API_URL}?action=getGameData`);
            const data = await res.json();
            if (data.success) gameData = data.islands;

            const [carG, t1, t2, f1, bullG, fenceG, islandG] = await Promise.all([
                loadModel('https://hussainsaamy.github.io/game-assets/Sports%20Car.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Tree.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Tree2.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Flowers.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Bull.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Fence.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Island.glb')
            ]);

            const grassTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
            grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(50, 50);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(MAP_SIZE+200, MAP_SIZE+200), new THREE.MeshStandardMaterial({map: grassTex}));
            ground.rotation.x = -Math.PI/2; gameGroup.add(ground);

            if(carG) {
                const myCar = carG.scene;
                myCar.scale.set(4, 4, 4); myCar.rotation.y = Math.PI;
                carGroup.add(myCar);
            }

            if(t1) for(let i=0; i<25; i++) spawnDeco(t1.scene, 5, 7, treesArray);
            if(t2) for(let i=0; i<25; i++) spawnDeco(t2.scene, 5, 7, treesArray);
            if(f1) for(let i=0; i<50; i++) spawnDeco(f1.scene, 2, 0, null);

            if(bullG) { 
                [160, -160].forEach(x => { 
                    const b = THREE.SkeletonUtils.clone(bullG.scene); 
                    b.position.set(x, 0, -60); 
                    b.scale.set(2.5, 2.5, 2.5); 
                    gameGroup.add(b); 
                    bullsArray.push({mesh:b, radius:8}); 
                    if(bullG.animations.length){ 
                        const m = new THREE.AnimationMixer(b); 
                        m.clipAction(bullG.animations[0]).play(); mixers.push(m); 
                    }
                }); 
            }

            if(fenceG) {
                const h = MAP_SIZE/2;
                for(let i=-h; i<=h; i+=15){ 
                    addF(fenceG.scene, i, -h, 0); addF(fenceG.scene, i, h, 0); 
                    addF(fenceG.scene, h, i, Math.PI/2); addF(fenceG.scene, -h, i, Math.PI/2); 
                }
            }

            const ocean = new THREE.Mesh(
                new THREE.PlaneGeometry(25000, 25000), 
                new THREE.MeshStandardMaterial({color: 0x0a5e9e, roughness: 0.1, metalness: 0.3})
            );
            ocean.rotation.x = -Math.PI/2; 
            mapGroup.add(ocean);

            const totalIslands = Math.min(50, gameData.length);
            if(islandG) {
                for(let i=0; i < totalIslands; i++) {
                    let pos = new THREE.Vector3();
                    let baseAngle = (i / totalIslands) * Math.PI * 2;
                    let angleJitter = (Math.random() - 0.5) * 0.1; 
                    let finalAngle = baseAngle + angleJitter;
                    let radius = 2500 + (Math.random() * 1200); 

                    pos.x = Math.cos(finalAngle) * radius;
                    pos.z = Math.sin(finalAngle) * radius;
                    
                    islandMapPositions.push(pos);

                    const iMesh = THREE.SkeletonUtils.clone(islandG.scene);
                    iMesh.position.copy(pos);
                    iMesh.scale.set(2, 2, 2); 
                    mapGroup.add(iMesh);
                }
            }

            gameGroup.visible = false;
            
            document.getElementById('load-text').innerText = "World Ready!";
            document.getElementById('start-btn').style.display = 'block';

        } catch (error) {
            document.getElementById('load-text').innerHTML = "Error connecting.";
        }
    }

    function spawnDeco(m, s, r, arr) {
        const d = m.clone(); 
        const x = (Math.random()-0.5)*MAP_SIZE, z = (Math.random()-0.5)*MAP_SIZE;
        if(Math.abs(x) < 130 && Math.abs(z) < 130) return; 
        d.position.set(x, 0, z); d.scale.set(s,s,s); gameGroup.add(d); 
        if(arr) arr.push({mesh:d, radius:r});
    }

    function addF(m, x, z, r) { 
        const f = m.clone(); f.position.set(x,0,z); f.rotation.y=r; f.scale.set(5, 12, 5); gameGroup.add(f); 
    }

    function createAntennaTower(height) {
        const towerGroup = new THREE.Group();
        const segments = 5;
        const segmentHeight = height / segments;
        const bottomRadius = height * 0.05; 
        const topRadius = height * 0.01;    

        for (let i = 0; i < segments; i++) {
            const rBottom = bottomRadius - ((bottomRadius - topRadius) * (i / segments));
            const rTop = bottomRadius - ((bottomRadius - topRadius) * ((i + 1) / segments));

            const geo = new THREE.CylinderGeometry(rTop, rBottom, segmentHeight, 4); 
            const mesh = new THREE.Mesh(geo, i % 2 === 0 ? towerMatRed : towerMatWhite);
            
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, towerEdgeMat);
            mesh.add(line);

            mesh.position.y = (i * segmentHeight) + (segmentHeight / 2) - (height / 2);
            mesh.rotation.y = Math.PI / 4; 
            towerGroup.add(mesh);
        }

        const dishGeo = new THREE.CylinderGeometry(height * 0.04, height * 0.02, height * 0.02, 8);
        const dish1 = new THREE.Mesh(dishGeo, dishMat);
        dish1.rotation.x = Math.PI / 2;
        dish1.position.set(height * 0.03, (height / 2) - (height * 0.15), height * 0.03);
        towerGroup.add(dish1);

        const dish2 = new THREE.Mesh(dishGeo, dishMat);
        dish2.rotation.x = Math.PI / 2;
        dish2.rotation.z = Math.PI / 2;
        dish2.position.set(-height * 0.03, (height / 2) - (height * 0.25), -height * 0.03);
        towerGroup.add(dish2);

        return towerGroup;
    }

    function generateMapPins() {
        for(let i = mapPinsGroup.children.length - 1; i >= 0; i--) { 
            mapPinsGroup.remove(mapPinsGroup.children[i]); 
        }
        flagHitboxes = [];
        
        for(let i=0; i < islandMapPositions.length; i++) {
            let state = islandStates[i]; 
            let pos = islandMapPositions[i];
            
            const tower1 = createAntennaTower(100);
            tower1.position.set(pos.x, 50, pos.z); 
            
            const cvs1 = document.createElement('canvas');
            cvs1.width = 128; cvs1.height = 128;
            const ctx1 = cvs1.getContext('2d');
            
            ctx1.fillStyle = state === 2 ? "#f1c40f" : (state === 1 ? "#3498db" : "#95a5a6"); 
            ctx1.beginPath();
            ctx1.arc(64, 64, 50, 0, Math.PI * 2);
            ctx1.fill();
            ctx1.lineWidth = 6;
            ctx1.strokeStyle = "white";
            ctx1.stroke();
            
            ctx1.fillStyle = "white";
            ctx1.textAlign = "center";
            ctx1.textBaseline = "middle";
            
            if (state === 2) {
                ctx1.font = "bold 50px Arial"; ctx1.fillText("🏆", 64, 64);
            } else if (state === 1) {
                ctx1.font = "bold 50px Arial"; ctx1.fillText(i + 1, 64, 64);
            } else {
                ctx1.font = "28px Arial"; ctx1.fillText("🔒", 64, 45); 
                ctx1.font = "bold 32px Arial"; ctx1.fillText(i + 1, 64, 82); 
            }
            
            const tex1 = new THREE.CanvasTexture(cvs1);
            const mat1 = new THREE.SpriteMaterial({map: tex1, depthTest: false});
            const sprite1 = new THREE.Sprite(mat1);
            sprite1.scale.set(100, 100, 1); 
            sprite1.position.set(pos.x, 120, pos.z);
            sprite1.userData = { type: 'driving', islandIndex: i }; 
            
            mapPinsGroup.add(tower1); 
            mapPinsGroup.add(sprite1);
            flagHitboxes.push(sprite1);

            if (state < 2) {
                const tower2 = createAntennaTower(60);
                tower2.position.set(pos.x + 50, 30, pos.z + 50); 
                
                const cvs2 = document.createElement('canvas');
                cvs2.width = 128; cvs2.height = 128;
                const ctx2 = cvs2.getContext('2d');
                ctx2.fillStyle = "#e74c3c"; ctx2.beginPath(); ctx2.arc(64, 64, 45, 0, Math.PI * 2); ctx2.fill();
                ctx2.lineWidth = 4; ctx2.strokeStyle = "white"; ctx2.stroke();
                ctx2.fillStyle = "white"; ctx2.font = "bold 45px Arial"; ctx2.textAlign = "center"; ctx2.textBaseline = "middle";
                ctx2.fillText("📝", 64, 64); 
                
                const tex2 = new THREE.CanvasTexture(cvs2);
                const sprite2 = new THREE.Sprite(new THREE.SpriteMaterial({map: tex2, depthTest: false}));
                sprite2.scale.set(70, 70, 1); 
                sprite2.position.set(pos.x + 50, 80, pos.z + 50);
                sprite2.userData = { type: 'worksheet', islandIndex: i }; 
                
                mapPinsGroup.add(tower2); 
                mapPinsGroup.add(sprite2); 
                flagHitboxes.push(sprite2);

                const tower3 = createAntennaTower(60);
                tower3.position.set(pos.x - 50, 30, pos.z + 50); 
                
                const cvs3 = document.createElement('canvas');
                cvs3.width = 128; cvs3.height = 128;
                const ctx3 = cvs3.getContext('2d');
                ctx3.fillStyle = "#3498db"; ctx3.beginPath(); ctx3.arc(64, 64, 45, 0, Math.PI * 2); ctx3.fill();
                ctx3.lineWidth = 4; ctx3.strokeStyle = "white"; ctx3.stroke();
                ctx3.fillStyle = "white"; ctx3.font = "bold 45px Arial"; ctx3.textAlign = "center"; ctx3.textBaseline = "middle";
                ctx3.fillText("📖", 64, 64); 
                
                const tex3 = new THREE.CanvasTexture(cvs3);
                const sprite3 = new THREE.Sprite(new THREE.SpriteMaterial({map: tex3, depthTest: false}));
                sprite3.scale.set(70, 70, 1); 
                sprite3.position.set(pos.x - 50, 80, pos.z + 50);
                sprite3.userData = { type: 'booklet', islandIndex: i }; 
                
                mapPinsGroup.add(tower3); 
                mapPinsGroup.add(sprite3); 
                flagHitboxes.push(sprite3);
            }
        }
    }

    function returnToMap() {
        if (isPaused) {
            isPaused = false;
            const btn = document.getElementById('pause-btn');
            btn.innerText = "⏸ PAUSE";
            btn.style.background = "#e74c3c"; 
            btn.style.borderColor = "#c0392b";
        }
        openMap(currentIsland); 
    }

    function openMap(focusIslandIndex = -1, keepCamera = false) {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('worksheet-screen').style.display = 'none';
        document.getElementById('booklet-screen').style.display = 'none';
        
        document.getElementById('ui-container').style.display = 'none';
        document.getElementById('left-controls').style.display = 'none';
        document.getElementById('speed-container').style.display = 'none';
        document.getElementById('tap-indicator').style.display = 'none';
        document.getElementById('map-overlay').style.display = 'block';
        
        if(engineAudio) engineAudio.pause();
        if(bullAudio) bullAudio.pause();
        isDriving = false;

        gameGroup.visible = false;
        mapGroup.visible = true;
        appState = 'MAP';

        generateMapPins(); 
        
        if (keepCamera) {
            // Keep existing camera config
        } else if (focusIslandIndex !== -1 && islandMapPositions[focusIslandIndex]) {
            let pos = islandMapPositions[focusIslandIndex];
            camera.position.set(pos.x, 1500, pos.z + 1000);
            controls.target.set(pos.x, 0, pos.z);
        } else {
            camera.position.set(0, 3000, 2000);
            controls.target.set(0, 0, 0);
        }
        
        controls.enabled = true;
        controls.enablePan = true;
        controls.touches = { ONE: THREE.TOUCH.PAN, TWO: THREE.TOUCH.DOLLY_ROTATE };
        controls.mouseButtons = { LEFT: THREE.MOUSE.PAN, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };
        
        // FIX: Tighter max angle to prevent looking under the horizon
        controls.maxPolarAngle = Math.PI / 2.4; 
        controls.minDistance = 200;
        controls.maxDistance = 6000; 
        controls.update(); 

        if (!gameStarted) {
            gameStarted = true;
            animate(); 
        }
    }

    function onPointerDown(event) {
        if(appState !== 'MAP') return;
        
        let currentTime = new Date().getTime();
        let tapLength = currentTime - lastTapTime;
        lastTapTime = currentTime;

        if(tapLength < 400 && tapLength > 0) {
            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(flagHitboxes);
            if (intersects.length > 0) {
                const tappedData = intersects[0].object.userData;
                
                if (tappedData.type === 'booklet') {
                    openBooklet(tappedData.islandIndex);
                }
                else if (tappedData.type === 'worksheet') {
                    if (!readBooklets[tappedData.islandIndex]) {
                        showToast("📖 Read the Blue Booklet first to learn the answers!");
                    } else {
                        startWorksheet(tappedData.islandIndex);
                    }
                } 
                else if (tappedData.type === 'driving') {
                    if (islandStates[tappedData.islandIndex] === 0) {
                        showToast("Complete the 📝 Worksheet first to unlock this island!");
                    } else {
                        startDrivingGame(tappedData.islandIndex);
                    }
                }
            }
        }
    }
    window.addEventListener('pointerdown', onPointerDown);
    
    function showToast(msg) {
        const toast = document.getElementById('toast-msg');
        toast.innerText = msg;
        toast.style.display = 'block';
        setTimeout(() => { toast.style.display = 'none'; }, 2500);
    }

    function openBooklet(index) {
        appState = 'BOOKLET';
        readBooklets[index] = true; 
        
        document.getElementById('map-overlay').style.display = 'none';
        document.getElementById('booklet-screen').style.display = 'flex';
        document.getElementById('bk-title').innerText = "Island " + (index + 1) + " Study Guide";
        
        let contentHTML = "";
        gameData[index].forEach((q, i) => {
            contentHTML += `
                <div class="qa-block">
                    <div class="q-text">ސުވާލު ${i+1}: ${q.question}</div>
                    <div class="a-text">ޖަވާބު: ${q.correctAnswer}</div>
                </div>
            `;
        });
        document.getElementById('bk-content').innerHTML = contentHTML;
    }

    function closeBooklet() {
        openMap(-1, true);
    }

    let wsCurrentIsland = 0;
    let wsCurrentQuestion = 0;
    let wsRemainingAnswers = [];
    let wsLives = 3;

    function startWorksheet(index) {
        appState = 'WORKSHEET';
        wsCurrentIsland = index;
        wsCurrentQuestion = 0;
        wsLives = 3; 
        
        document.getElementById('map-overlay').style.display = 'none';
        document.getElementById('worksheet-screen').style.display = 'flex';
        
        let islandQ = gameData[wsCurrentIsland];
        wsRemainingAnswers = islandQ.map(q => q.correctAnswer);
        wsRemainingAnswers.sort(() => Math.random() - 0.5); 
        
        document.getElementById('ws-title').innerText = "Island " + (index + 1);
        updateLivesUI();
        renderWorksheet();
    }

    function updateLivesUI() {
        document.getElementById('ws-lives').innerText = '❤️'.repeat(wsLives);
    }

    function renderWorksheet() {
        let islandQ = gameData[wsCurrentIsland];
        document.getElementById('ws-question-box').innerText = islandQ[wsCurrentQuestion].question;
        
        const grid = document.getElementById('ws-answers-grid');
        grid.innerHTML = ''; 
        
        wsRemainingAnswers.forEach(ans => {
            let btn = document.createElement('button');
            btn.className = 'ws-answer-btn';
            btn.innerText = ans;
            btn.onclick = function() { checkWorksheetAnswer(this, ans); };
            grid.appendChild(btn);
        });
    }

    function checkWorksheetAnswer(btnElement, selectedAnswer) {
        let correctAns = gameData[wsCurrentIsland][wsCurrentQuestion].correctAnswer;
        
        if (selectedAnswer === correctAns) {
            wsRemainingAnswers = wsRemainingAnswers.filter(a => a !== correctAns);
            wsCurrentQuestion++;
            
            if (wsCurrentQuestion >= 10) {
                if (islandStates[wsCurrentIsland] < 1) islandStates[wsCurrentIsland] = 1; 
                showToast("🎉 Island Unlocked! Double-tap the Flag to Drive!");
                openMap(-1, true);
            } else {
                renderWorksheet(); 
            }
        } else {
            wsLives--;
            updateLivesUI();
            
            btnElement.style.background = "#e74c3c";
            setTimeout(() => { btnElement.style.background = "#2ecc71"; }, 800);

            if (wsLives <= 0) {
                showToast("💀 Game Over! Try again.");
                setTimeout(() => { startWorksheet(wsCurrentIsland); }, 1500);
            }
        }
    }

    function closeWorksheet() {
        openMap(-1, true);
    }

    function startDrivingGame(index) {
        currentIsland = index;
        currentQuestion = 0;
        
        appState = 'PLAYING';
        mapGroup.visible = false;
        gameGroup.visible = true;
        
        document.getElementById('map-overlay').style.display = 'none';
        document.getElementById('ui-container').style.display = 'flex';
        document.getElementById('left-controls').style.display = 'flex'; 
        document.getElementById('speed-container').style.display = 'flex'; 
        document.getElementById('tap-indicator').style.display = 'block'; 
        
        engineAudio.volume = 1.0;
        bullAudio.volume = 0.0;
        engineAudio.play().catch(e => console.log(e));
        bullAudio.play().catch(e => console.log(e));

        isDriving = false; 
        isPaused = false;
        cameraMode = 0; 
        controls.enabled = false;
        
        loadIslandBoards(); 
    }

    function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById('pause-btn');
        if (isPaused) {
            btn.innerText = "▶ RESUME";
            btn.style.background = "#27ae60"; 
            btn.style.borderColor = "#2ecc71";
            
            engineAudio.pause();
            bullAudio.pause();

            controls.enabled = true;
            controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };
            controls.minDistance = 2; 
            controls.maxDistance = 200; 
            controls.target.set(carGroup.position.x, carGroup.position.y + 2, carGroup.position.z); 
            controls.update(); 
            
            document.getElementById('tap-indicator').style.display = 'none';
        } else {
            btn.innerText = "⏸ PAUSE";
            btn.style.background = "#e74c3c"; 
            btn.style.borderColor = "#c0392b";
            
            engineAudio.play();
            bullAudio.play();

            controls.enabled = false;
            if(!isDriving) document.getElementById('tap-indicator').style.display = 'block';
        }
    }

    function toggleCamera() {
        cameraMode = (cameraMode + 1) % 3;
        const btn = document.getElementById('cam-btn');
        if (cameraMode === 0) btn.innerHTML = "🎥 ACTION";
        if (cameraMode === 1) btn.innerHTML = "🚁 DRONE";
        if (cameraMode === 2) btn.innerHTML = "🔄 360 VIEW";
    }

    function createSignText(text, color) {
        const c = document.createElement('canvas'); const ctx = c.getContext('2d');
        const canvasWidth = 1024; const fontSize = 64;
        ctx.font = `bold ${fontSize}px 'Faruma', 'MV Boli', 'Noto Sans Thaana'`;
        
        const words = text.split(' '); let lines = []; let currentLine = words[0] || "";
        for (let i = 1; i < words.length; i++) {
            const testLine = currentLine + " " + words[i];
            if (ctx.measureText(testLine).width < canvasWidth - 120) { currentLine = testLine; } 
            else { lines.push(currentLine); currentLine = words[i]; }  
        }
        lines.push(currentLine);
        
        const canvasHeight = Math.max(512, (lines.length * (fontSize + 30)) + 120);
        c.width = canvasWidth; c.height = canvasHeight;
        
        ctx.fillStyle = color; ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl"; 
        ctx.font = `bold ${fontSize}px 'Faruma', 'MV Boli', 'Noto Sans Thaana'`;
        
        const startY = (c.height / 2) - (((lines.length - 1) * (fontSize + 30)) / 2);
        lines.forEach((line, index) => { ctx.fillText(line, c.width / 2, startY + (index * (fontSize + 30))); });
        
        const tex = new THREE.CanvasTexture(c); 
        return { tex: tex, color: color, w: 24, h: (canvasHeight / canvasWidth) * 24 };
    }

    function getSafeBoardPosition() {
        let pos = {x: 0, z: 0};
        let safe = false;
        
        while (!safe) { 
            pos.x = (Math.random() - 0.5) * 220; 
            pos.z = (Math.random() - 0.5) * 220;
            if (Math.abs(pos.x) < 40 && Math.abs(pos.z) < 40) continue; 
            
            safe = true;
            for (let b of signboardsArray) {
                if (Math.hypot(pos.x - b.mesh.position.x, pos.z - b.mesh.position.z) < 40) {
                    safe = false; break;
                }
            }
        }
        return pos;
    }

    function loadIslandBoards() {
        signboardsArray.forEach(b => gameGroup.remove(b.mesh));
        signboardsArray.length = 0;

        let islandQuestions = gameData[currentIsland];
        let totalQuestions = islandQuestions.length;
        
        let answerSet = [];
        for(let i = 0; i < totalQuestions; i++) {
            answerSet.push({ text: islandQuestions[i].correctAnswer, qIndex: i });
        }
        answerSet.sort(() => Math.random() - 0.5);

        for(let i = 0; i < answerSet.length && i < 10; i++) {
            let color = signColors[i % signColors.length];
            let pos = getSafeBoardPosition();
            spawnBoard(answerSet[i].text, color, answerSet[i].qIndex, pos.x, pos.z);
        }

        carGroup.position.set(0,0,0);
        carGroup.rotation.set(0,0,0);
        isDriving = false; 
        document.getElementById('tap-indicator').style.display = 'block'; 
        updateQuestionUI();
    }

    function updateQuestionUI() {
        if (currentQuestion >= gameData[currentIsland].length) {
            islandStates[currentIsland] = 2; 
            showToast("🏆 You Earned a Trophy! Returning to Map...");
            setTimeout(() => { openMap(currentIsland); }, 2000); 
            return;
        }
        
        let qData = gameData[currentIsland][currentQuestion];
        document.getElementById('question-box').innerText = qData.question;
        document.getElementById('island-counter').innerText = `${currentIsland + 1} / 50`;
    }
    
    function showWrongAnswerUI() {
        const qBox = document.getElementById('question-box');
        qBox.innerText = "ނުބައި ޖަވާބު! (Wrong Answer!)";
        qBox.style.background = "#e74c3c";
        qBox.style.color = "white";
        
        setTimeout(() => {
            qBox.innerText = gameData[currentIsland][currentQuestion].question;
            qBox.style.background = "rgba(255,255,255,0.95)";
            qBox.style.color = "black";
        }, 1500);
    }

    function spawnBoard(text, color, qIndex, xPos, zPos) {
        const signData = createSignText(text, color);
        const g = new THREE.Group();
        
        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 10), new THREE.MeshStandardMaterial({color: 0x333333})); 
        p.position.y = 5; 
        g.add(p);
        
        const boxMat = new THREE.MeshStandardMaterial({color: color});
        const b = new THREE.Mesh(new THREE.BoxGeometry(signData.w, signData.h, 1.0), boxMat); 
        b.position.set(0, 10 + (signData.h/2 - 5), 0); 
        g.add(b);

        const textMat = new THREE.MeshStandardMaterial({map: signData.tex});
        const frontFace = new THREE.Mesh(new THREE.PlaneGeometry(signData.w, signData.h), textMat);
        frontFace.position.set(0, 10 + (signData.h/2 - 5), 0.51); 
        g.add(frontFace);

        const backFace = new THREE.Mesh(new THREE.PlaneGeometry(signData.w, signData.h), textMat);
        backFace.position.set(0, 10 + (signData.h/2 - 5), -0.51); 
        backFace.rotation.y = Math.PI;
        g.add(backFace);

        g.position.set(xPos, 0, zPos); 
        gameGroup.add(g);
        signboardsArray.push({ mesh: g, qIndex: qIndex });
    }

    function handleInteractionStart(e) {
        if(appState !== 'PLAYING') return; 
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return; 
        if (!isPaused) {
            isDriving = true; 
            document.getElementById('tap-indicator').style.display = 'none'; 
            
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            let screenW = window.innerWidth;

            if (clientX < screenW * 0.3) {
                activeSteering = 1; 
            } else if (clientX > screenW * 0.7) {
                activeSteering = -1; 
            } else {
                isLooking = true; 
                lookStartX = clientX;
                lookStartY = clientY; 
            }
        }
    }
    
    function handleInteractionMove(e) {
        if(appState !== 'PLAYING') return;
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        if (!isPaused && isLooking) {
            let clientX = e.touches ? e.touches[0].clientX : e.clientX;
            let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            
            let deltaX = clientX - lookStartX;
            let deltaY = clientY - lookStartY;
            
            targetCamAngleOffset = -(deltaX / window.innerWidth) * Math.PI * 1.5; 
            targetCamPitchOffset = -(deltaY / window.innerHeight) * Math.PI; 
        }
    }

    function handleInteractionEnd() {
        if(appState !== 'PLAYING') return;
        activeSteering = 0;
        isLooking = false;
        targetCamAngleOffset = 0; 
        targetCamPitchOffset = 0; 
    }

    window.addEventListener('touchstart', handleInteractionStart, {passive: false});
    window.addEventListener('mousedown', handleInteractionStart);
    window.addEventListener('touchmove', handleInteractionMove, {passive: false});
    window.addEventListener('mousemove', handleInteractionMove);
    window.addEventListener('touchend', handleInteractionEnd);
    window.addEventListener('mouseup', handleInteractionEnd);

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta(); 
        mixers.forEach(m => m.update(delta)); 
        
        if (appState === 'MAP') {
            // FIX: Lock target.y strictly to 0 to prevent camera from ever dipping below the ocean plane
            controls.target.y = 0; 
            controls.update(); 
            renderer.render(scene, camera);
            return;
        }

        if (appState === 'PLAYING') {
            if (!isPaused) {
                camAngleOffset += (targetCamAngleOffset - camAngleOffset) * 0.1;
                camPitchOffset += (targetCamPitchOffset - camPitchOffset) * 0.1;
                
                let speed = parseFloat(document.getElementById('speed-slider').value);
                
                if (isDriving) {
                    if(engineAudio && speed > 0) engineAudio.playbackRate = 0.5 + (speed / 1.5);

                    if (activeSteering === 1) carGroup.rotation.y += 0.04;
                    else if (activeSteering === -1) carGroup.rotation.y -= 0.04;

                    const oldPos = carGroup.position.clone();
                    carGroup.translateZ(-speed);

                    for(let t of treesArray) if(carGroup.position.distanceTo(t.mesh.position) < t.radius) { carGroup.position.copy(oldPos); }
                    for(let b of bullsArray) if(carGroup.position.distanceTo(b.mesh.position) < b.radius) { carGroup.position.copy(oldPos); }
                    if(Math.abs(carGroup.position.x) > BOUNDARY || Math.abs(carGroup.position.z) > BOUNDARY) { carGroup.position.copy(oldPos); }

                    let hitIndex = -1;
                    let correctHit = false;

                    for (let i = 0; i < signboardsArray.length; i++) {
                        let board = signboardsArray[i];
                        if (carGroup.position.distanceTo(board.mesh.position) < 4.5) {
                            if (board.qIndex === currentQuestion) {
                                hitIndex = i;
                                correctHit = true;
                                break;
                            } else {
                                carGroup.translateZ(15); 
                                isDriving = false;       
                                document.getElementById('tap-indicator').style.display = 'block'; 
                                showWrongAnswerUI();
                                break;
                            }
                        }
                    }

                    if (correctHit) {
                        gameGroup.remove(signboardsArray[hitIndex].mesh);
                        signboardsArray.splice(hitIndex, 1);
                        currentQuestion++;
                        updateQuestionUI();
                    }

                } else {
                    if(engineAudio) engineAudio.playbackRate = 0.5; 
                }

                let mD = 1000; 
                bullsArray.forEach(b => { 
                    let d = carGroup.position.distanceTo(b.mesh.position); 
                    if(d < mD) mD = d; 
                }); 
                bullAudio.volume = Math.max(0, 1 - (mD / 120)); 

                const cy = carGroup.rotation.y + camAngleOffset; 
                
                if (cameraMode === 0) {
                    const mPitch = 0.3; 
                    camera.position.lerp(new THREE.Vector3(
                        carGroup.position.x + 25 * Math.sin(cy) * Math.cos(mPitch), 
                        carGroup.position.y + 22 * Math.sin(mPitch) + 4, 
                        carGroup.position.z + 25 * Math.cos(cy) * Math.cos(mPitch)
                    ), 0.1);
                    
                    let lookY = carGroup.position.y + 1 + (camPitchOffset * 40); 
                    camera.lookAt(carGroup.position.x - 20 * Math.sin(cy), lookY, carGroup.position.z - 20 * Math.cos(cy));
                    
                } else if (cameraMode === 1) {
                    camera.position.lerp(new THREE.Vector3(
                        carGroup.position.x + 40 * Math.sin(cy), 
                        carGroup.position.y + 50, 
                        carGroup.position.z + 40 * Math.cos(cy)
                    ), 0.1);
                    camera.lookAt(carGroup.position.x - 20 * Math.sin(cy), carGroup.position.y, carGroup.position.z - 20 * Math.cos(cy));
                    
                } else if (cameraMode === 2) {
                    const time = Date.now() * 0.0005; 
                    camera.position.lerp(new THREE.Vector3(
                        carGroup.position.x + 40 * Math.sin(time), 
                        carGroup.position.y + 20, 
                        carGroup.position.z + 40 * Math.cos(time)
                    ), 0.1);
                    camera.lookAt(carGroup.position.x, carGroup.position.y + 2, carGroup.position.z);
                }
            } else {
                controls.update(); 
            }

            renderer.render(scene, camera);
        }
    }

    initAssets();
  </script>
