<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <title>3D Island Drive - SSC Islam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #0a5e9e; touch-action: none; font-family: 'Faruma', 'MV Boli', sans-serif !important; }
    canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1;}
    
    #login-screen { position: absolute; width: 100%; height: 100%; background: linear-gradient(135deg, #1abc9c, #2980b9); z-index: 1000; display: flex; flex-direction: column; justify-content: center; align-items: center; }
    .login-box { background: rgba(255,255,255,0.95); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); text-align: center; width: 85%; max-width: 400px; }
    .login-box h1 { color: #2c3e50; margin-bottom: 20px; }
    .login-input { width: 90%; padding: 15px; margin: 10px 0; border: 2px solid #bdc3c7; border-radius: 10px; font-size: 18px; text-align: center;}
    #login-btn { width: 100%; padding: 15px; background: #2ecc71; color: white; border: none; border-radius: 10px; font-size: 20px; font-weight: bold; cursor: pointer; margin-top: 15px; }
    #login-error { color: #e74c3c; font-weight: bold; margin-top: 15px; display: none; }

    #ui-container { position: absolute; top: 20px; width: 100%; z-index: 100; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
    #trophy { background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 20px; font-size: 16px; font-weight: bold; margin-bottom: 5px; color: gold; border: 1px solid gold; text-shadow: 2px 2px 4px black;}
    
    #question-box { background: transparent; color: white; padding: 5px 10px; border-radius: 15px; font-size: 20px; font-weight: bold; text-align: center; border: none; direction: rtl; width: 95%; max-width: 800px; text-shadow: 2px 2px 4px rgba(0,0,0,1), -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000; transition: color 0.3s, background 0.3s; line-height: 1.3; }

    #top-left-stats { position: absolute; top: 20px; left: 15px; z-index: 100; display: none; flex-direction: column; align-items: flex-start; gap: 5px; pointer-events: none; }
    #timer-ui { color: #f1c40f; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px black; font-family: Arial; }
    #driving-lives { font-size: 22px; letter-spacing: 2px; text-shadow: 2px 2px 4px black;}

    #loading-screen { position: absolute; width: 100%; height: 100%; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 500; color: white; font-size: 24px; text-align: center; padding: 20px; display: none;}
    #start-btn { display: none; margin-top: 20px; padding: 15px 50px; font-size: 24px; background: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: inherit; box-shadow: 0px 5px 15px rgba(0,255,0,0.4); }
    
    #left-controls { position: absolute; bottom: 45px; left: 20px; z-index: 9999; display: none; flex-direction: row; gap: 8px; }
    .control-btn { padding: 12px 10px; font-size: 14px; color: white; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: Arial, sans-serif; box-shadow: 0px 4px 8px rgba(0,0,0,0.5); border: none; }
    #pause-btn { background: #e74c3c; border-bottom: 4px solid #c0392b; }
    #cam-btn { background: #3498db; border-bottom: 4px solid #2980b9; }
    #map-btn { background: #f39c12; border-bottom: 4px solid #d68910; } 
    
    #speed-container { position: absolute; bottom: 45px; right: 20px; z-index: 9999; display: none; flex-direction: column; align-items: center; background: rgba(0,0,0,0.7); padding: 15px 10px; border-radius: 20px; border: 2px solid #4CAF50; box-shadow: 0px 4px 8px rgba(0,0,0,0.5); }
    #speed-slider { -webkit-appearance: slider-vertical; appearance: slider-vertical; width: 30px; height: 160px; margin: 10px 0; cursor: pointer; accent-color: #4CAF50; }
    .speed-icon { font-size: 26px; }
    
    #tap-indicator { position: absolute; top: 60%; width: 100%; text-align: center; color: white; font-size: 22px; font-weight: bold; text-shadow: 2px 2px 4px black; z-index: 50; animation: blink 1.5s infinite; pointer-events: none; display: none; }
    @keyframes blink { 0% {opacity: 1;} 50% {opacity: 0.2;} 100% {opacity: 1;} }

    #map-overlay { position: absolute; top: 50px; width: 100%; text-align: center; color: white; font-size: 24px; font-weight: bold; text-shadow: 2px 2px 4px black; z-index: 100; display: none; pointer-events: none; }
    #map-overlay span { background: rgba(0,0,0,0.6); padding: 10px 20px; border-radius: 15px; border: 2px solid #3498db; }
    #toast-msg { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(231, 76, 60, 0.95); color: white; font-size: 24px; font-weight: bold; padding: 20px 40px; border-radius: 15px; z-index: 999; display: none; text-align: center; border: 3px solid white; box-shadow: 0 10px 20px rgba(0,0,0,0.5); pointer-events: none;}

    #worksheet-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #fdfbf7; z-index: 400; display: none; flex-direction: column; align-items: center; padding: 60px 20px 120px 20px; box-sizing: border-box; overflow-y: auto; font-family: inherit; }
    #ws-header { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; }
    #ws-back-btn { background: #f39c12; color: white; padding: 12px 20px; border-radius: 10px; font-weight: bold; border: none; font-size: 18px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
    #ws-title { font-size: 26px; color: #2c3e50; font-weight: bold; }
    #ws-lives { font-size: 24px; letter-spacing: 2px; }
    #ws-question-box { background: white; padding: 25px; border-radius: 15px; font-size: 26px; font-weight: bold; text-align: center; width: 100%; max-width: 600px; box-shadow: 0 6px 12px rgba(0,0,0,0.1); margin-bottom: 25px; border: 3px solid #3498db; color: #2c3e50;}
    #ws-answers-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 600px; }
    .ws-answer-btn { background: #2ecc71; color: white; padding: 18px; border-radius: 10px; border: none; font-size: 22px; cursor: pointer; font-family: inherit; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.2); transition: background 0.3s; text-align: right;}

    #booklet-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #e8f4f8; z-index: 400; display: none; flex-direction: column; align-items: center; padding: 60px 20px 120px 20px; box-sizing: border-box; overflow-y: auto; font-family: inherit; }
    #bk-header { width: 100%; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; margin-bottom: 20px; gap: 15px; }
    #bk-back-btn { background: #3498db; color: white; padding: 12px 20px; border-radius: 10px; font-weight: bold; border: none; font-size: 18px; cursor: pointer; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}
    #bk-title { font-size: 26px; color: #2c3e50; font-weight: bold; }
    #bk-content { width: 100%; max-width: 600px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 50px; }
    .qa-block { background: white; padding: 15px; border-radius: 10px; border: 2px solid #3498db; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: right; }
    .q-text { font-size: 22px; font-weight: bold; color: #e74c3c; margin-bottom: 8px; }
    .a-text { font-size: 20px; color: #2ecc71; font-weight: bold; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-box" dir="ltr">
        <h1>3D Island Drive</h1>
        <p>Login to compete!</p>
        <input type="text" id="username" class="login-input" placeholder="Username">
        <input type="password" id="password" class="login-input" placeholder="Password">
        <button id="login-btn" onclick="attemptLogin()">LOGIN</button>
        <div id="login-error">Incorrect Username or Password!</div>
    </div>
  </div>

  <div id="loading-screen">
    <span id="load-text" style="color: #4CAF50; font-size: 30px;">"أَسْتَغْفِرُ الله" ލޯޑް ވަންދެން ކިޔަމުން ގެންދޭ</span>
    <button id="start-btn" onclick="openMap()">OPEN MAP</button>
  </div>

  <div id="map-overlay"><span>🗺️ Double-Tap to Play!</span></div>
  <div id="toast-msg"></div>

  <div id="booklet-screen">
      <div id="bk-header" dir="ltr">
          <button id="bk-back-btn" onclick="closeBooklet()">✅ DONE READING</button>
          <div id="bk-title">Island 1 - Study Guide</div>
      </div>
      <div id="bk-content" dir="rtl"></div>
  </div>

  <div id="worksheet-screen">
      <div id="ws-header" dir="ltr">
          <button id="ws-back-btn" onclick="closeWorksheet()">🗺️ MAP</button>
          <div id="ws-title">Island 1</div>
          <div id="ws-lives">❤️❤️❤️</div>
      </div>
      <div id="ws-question-box">Question loads here</div>
      <div id="ws-answers-grid" id="answers-container"></div>
  </div>

  <div id="top-left-stats" dir="ltr">
      <div id="timer-ui">⏱️ 00:00</div>
      <div id="driving-lives">❤️❤️❤️</div>
  </div>

  <div id="ui-container" style="display: none;">
    <div id="trophy" dir="ltr">🏆 Island <span id="island-counter">1 / 50</span></div>
    <div id="question-box">Loading...</div>
  </div>
  
  <div id="tap-indicator">Tap sides to steer.<br>Swipe middle to look around!</div>

  <div id="left-controls">
    <button id="map-btn" class="control-btn" onclick="returnToMap()" dir="ltr">🗺️ MAP</button>
    <button id="pause-btn" class="control-btn" onclick="togglePause()" dir="ltr">⏸ PAUSE</button>
    <button id="cam-btn" class="control-btn" onclick="toggleCamera()" dir="ltr">🎥 ACTION</button>
  </div>

  <div id="speed-container">
    <span class="speed-icon">🐰</span>
    <input type="range" id="speed-slider" min="0" max="2.5" step="0.1" value="1.0" orient="vertical" dir="ltr">
    <span class="speed-icon">🐢</span>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbx36c9B5tle6IENGhvZH05CEMTZKpfS5quUPhRMgVvnWPpp5hJ26US6hSoZhYezaRTV/exec"; 

    let audioCtx;
    let engineOsc;
    let engineGain;

    function initEngineSound() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            engineOsc = audioCtx.createOscillator();
            engineOsc.type = 'sawtooth';
            engineOsc.frequency.setValueAtTime(40, audioCtx.currentTime);

            let filter = audioCtx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, audioCtx.currentTime);

            engineGain = audioCtx.createGain();
            engineGain.gain.setValueAtTime(0, audioCtx.currentTime);

            engineOsc.connect(filter);
            filter.connect(engineGain);
            engineGain.connect(audioCtx.destination);
            engineOsc.start();
        }
        if(audioCtx.state === 'suspended') audioCtx.resume();
    }

    function updateEngineSound(driving, speed) {
        if (!audioCtx || !engineGain) return;
        if (driving && !isPaused) {
            engineGain.gain.setTargetAtTime(0.2, audioCtx.currentTime, 0.1);
            engineOsc.frequency.setTargetAtTime(40 + (speed * 40), audioCtx.currentTime, 0.1);
        } else {
            engineGain.gain.setTargetAtTime(0, audioCtx.currentTime, 0.1);
        }
    }

    async function safeFetch(url, retries = 3) {
        for (let i = 0; i < retries; i++) {
            try {
                let res = await fetch(url);
                return await res.json();
            } catch (e) {
                if (i === retries - 1) throw e;
                await new Promise(r => setTimeout(r, 1000));
            }
        }
    }

    let currentUser = null;
    let gameData = [];
    let leaderboardData = {}; 
    
    let islandStates = new Array(50).fill(0); 
    let readBooklets = new Array(50).fill(false);
    let appState = 'LOGIN'; 

    let currentIsland = 0;
    let currentQuestion = 0;
    
    let gameStartTime = 0;
    let timerInterval = null;
    let drivingLives = 3;

    let gameStarted = false;
    let isPaused = false; 
    let isDriving = false; 
    let MAP_SIZE = 400, BOUNDARY = 190;
    let cameraMode = 0; 
    
    let activeSteering = 0; 
    let isLooking = false;
    let lookStartX = 0;
    let lookStartY = 0;
    let camAngleOffset = 0;
    let targetCamAngleOffset = 0;
    let camPitchOffset = 0;
    let targetCamPitchOffset = 0;
    
    const signColors = ["#1B5E20", "#0D47A1", "#B71C1C", "#4A148C", "#E65100", "#006064", "#212121"];
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); 
    const clock = new THREE.Clock();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 15000); 
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    const gameGroup = new THREE.Group(); scene.add(gameGroup);
    const mapGroup = new THREE.Group(); scene.add(mapGroup);
    const mapPinsGroup = new THREE.Group(); mapGroup.add(mapPinsGroup);
    
    const signboardsArray = [], treesArray = [], mixers = [];
    let islandMapPositions = [];
    let flagHitboxes = []; 

    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let lastTapTime = 0;

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enabled = false; 
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.screenSpacePanning = false;

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(100, 200, 100); scene.add(sun);

    const carGroup = new THREE.Group(); gameGroup.add(carGroup);
    const gltfLoader = new THREE.GLTFLoader();

    const towerMatRed = new THREE.MeshStandardMaterial({color: 0xcc0000, roughness: 0.8, flatShading: true});
    const towerMatWhite = new THREE.MeshStandardMaterial({color: 0xffffff, roughness: 0.8, flatShading: true});
    const towerEdgeMat = new THREE.LineBasicMaterial({ color: 0x222222, linewidth: 2 });
    const dishMat = new THREE.MeshStandardMaterial({color: 0x555555});

    function loadModel(url) { return new Promise(res => gltfLoader.load(url, res, undefined, () => res(null))); }

    function saveProgress() {
        if (!currentUser) return;
        
        localStorage.setItem('islandStates_' + currentUser.username, JSON.stringify(islandStates));
        localStorage.setItem('readBooklets_' + currentUser.username, JSON.stringify(readBooklets));

        try {
            const url = `${API_URL}?action=saveProgress&user=${encodeURIComponent(currentUser.username)}&states=${encodeURIComponent(JSON.stringify(islandStates))}&booklets=${encodeURIComponent(JSON.stringify(readBooklets))}`;
            fetch(url); 
        } catch(e) { console.log("Cloud save request error"); }
    }

    async function loadProgress() {
        if (!currentUser) return;
        
        try {
            const url = `${API_URL}?action=loadProgress&user=${encodeURIComponent(currentUser.username)}`;
            const data = await safeFetch(url);
            
            if (data && data.success && data.states) {
                islandStates = JSON.parse(data.states);
                readBooklets = JSON.parse(data.booklets);
                return; 
            }
        } catch(e) { 
            console.log("Cloud load failed, checking local backup..."); 
        }

        let savedStates = localStorage.getItem('islandStates_' + currentUser.username);
        if (savedStates) islandStates = JSON.parse(savedStates);
        else islandStates = new Array(50).fill(0);

        let savedBooklets = localStorage.getItem('readBooklets_' + currentUser.username);
        if (savedBooklets) readBooklets = JSON.parse(savedBooklets);
        else readBooklets = new Array(50).fill(false);
    }

    async function attemptLogin() {
        const u = document.getElementById('username').value.trim();
        const p = document.getElementById('password').value.trim();
        const btn = document.getElementById('login-btn');
        const err = document.getElementById('login-error');
        
        if(!u || !p) return;
        btn.innerText = "Connecting to Server..."; 
        err.style.display = "none";

        try {
            const data = await safeFetch(`${API_URL}?action=login&username=${encodeURIComponent(u)}&password=${encodeURIComponent(p)}`);
            
            if(data && data.success) {
                currentUser = data;
                
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('loading-screen').style.display = 'flex';
                
                await Promise.all([
                    loadProgress(),
                    initAssets()
                ]);

            } else {
                err.innerText = "Incorrect Username or Password!";
                err.style.display = "block";
                btn.innerText = "LOGIN";
            }
        } catch (e) {
            err.innerText = "Network Error. Please try again.";
            err.style.display = "block";
            btn.innerText = "LOGIN";
        }
    }

    function createMountains() {
        const mountainMat1 = new THREE.MeshStandardMaterial({color: 0x2d4c1e, roughness: 0.9, flatShading: true}); 
        const mountainMat2 = new THREE.MeshStandardMaterial({color: 0x3b5e2b, roughness: 0.9, flatShading: true}); 
        
        for(let i=0; i<60; i++) {
            let angle = (i / 60) * Math.PI * 2;
            angle += (Math.random() - 0.5) * 0.1; 
            
            let radius = 4800 + Math.random() * 1500; 
            let height = 500 + Math.random() * 800; 
            let width = 400 + Math.random() * 500; 
            
            const geo = new THREE.ConeGeometry(width, height, 4 + Math.floor(Math.random()*4));
            const mesh = new THREE.Mesh(geo, Math.random() > 0.5 ? mountainMat1 : mountainMat2);
            
            mesh.position.set(Math.cos(angle) * radius, (height/2) - 100, Math.sin(angle) * radius);
            mesh.rotation.y = Math.random() * Math.PI;
            
            mapGroup.add(mesh);
        }
    }

    async function initAssets() {
        try {
            const [d, lbData, carG, t1, t2, f1, fenceG, islandG, boatG] = await Promise.all([
                safeFetch(`${API_URL}?action=getGameData`),
                safeFetch(`${API_URL}?action=getLeaderboard`),
                loadModel('newcar.glb'), 
                loadModel('https://hussainsaamy.github.io/game-assets/Tree.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Tree2.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Flowers.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Fence.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Island.glb'),
                loadModel('boat.glb') 
            ]);

            if (d && d.success) gameData = d.islands;
            leaderboardData = lbData || {};

            const grassTex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
            grassTex.wrapS = grassTex.wrapT = THREE.RepeatWrapping; grassTex.repeat.set(50, 50);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(MAP_SIZE+200, MAP_SIZE+200), new THREE.MeshStandardMaterial({map: grassTex}));
            ground.rotation.x = -Math.PI/2; gameGroup.add(ground);

            if(carG) {
                const myCar = carG.scene;
                myCar.scale.set(0.03, 0.03, 0.03); 
                myCar.rotation.y = Math.PI; 
                carGroup.add(myCar);
            }

            if(t1) for(let i=0; i<25; i++) spawnDeco(t1.scene, 5, 7, treesArray);
            if(t2) for(let i=0; i<25; i++) spawnDeco(t2.scene, 5, 7, treesArray);
            if(f1) for(let i=0; i<50; i++) spawnDeco(f1.scene, 2, 0, null);

            if(fenceG) {
                const h = MAP_SIZE/2;
                for(let i=-h; i<=h; i+=15){ 
                    addF(fenceG.scene, i, -h, 0); addF(fenceG.scene, i, h, 0); 
                    addF(fenceG.scene, h, i, Math.PI/2); addF(fenceG.scene, -h, i, Math.PI/2); 
                }
            }

            const ocean = new THREE.Mesh(
                new THREE.PlaneGeometry(25000, 25000), 
                new THREE.MeshStandardMaterial({color: 0x0a5e9e, roughness: 0.1, metalness: 0.3})
            );
            ocean.rotation.x = -Math.PI/2; 
            mapGroup.add(ocean);

            const totalIslands = Math.min(50, gameData.length);
            if(islandG) {
                for(let i=0; i < totalIslands; i++) {
                    let pos = new THREE.Vector3();
                    let baseAngle = (i / totalIslands) * Math.PI * 2;
                    let angleJitter = (Math.random() - 0.5) * 0.1; 
                    let finalAngle = baseAngle + angleJitter;
                    let radius = 2500 + (Math.random() * 1200); 

                    pos.x = Math.cos(finalAngle) * radius;
                    pos.z = Math.sin(finalAngle) * radius;
                    islandMapPositions.push(pos);

                    const iMesh = THREE.SkeletonUtils.clone(islandG.scene);
                    iMesh.position.copy(pos);
                    iMesh.scale.set(2, 2, 2); 
                    mapGroup.add(iMesh);
                }
            }
            
            createMountains();

            const boatGroup = new THREE.Group();
            boatGroup.position.set(0, 0, 0);

            if (boatG) {
                const customBoat = THREE.SkeletonUtils.clone(boatG.scene);
                customBoat.scale.set(50, 50, 50); 
                boatGroup.add(customBoat);
            }

            const logoTex = new THREE.TextureLoader().load('logo.png');
            const logoMat = new THREE.SpriteMaterial({map: logoTex, color: 0xffffff});
            const logoSprite = new THREE.Sprite(logoMat);
            logoSprite.scale.set(1200, 450, 1); 
            logoSprite.position.set(0, 1200, 0); 
            boatGroup.add(logoSprite);

            mixers.push({
                update: function(delta) {
                    const time = Date.now() * 0.0015;
                    boatGroup.position.y = Math.sin(time) * 30; 
                    boatGroup.rotation.z = Math.sin(time * 0.8) * 0.03; 
                    boatGroup.rotation.x = Math.cos(time * 0.5) * 0.02; 
                }
            });

            mapGroup.add(boatGroup);

            gameGroup.visible = false;
            document.getElementById('load-text').innerText = "Welcome, " + currentUser.username + "!";
            document.getElementById('start-btn').style.display = 'block';

    function createAntennaTower(height) {
        const towerGroup = new THREE.Group();
        const segments = 5;
        const segmentHeight = height / segments;
        const bottomRadius = height * 0.05; 
        const topRadius = height * 0.01;    

        for (let i = 0; i < segments; i++) {
            const rBottom = bottomRadius - ((bottomRadius - topRadius) * (i / segments));
            const rTop = bottomRadius - ((bottomRadius - topRadius) * ((i + 1) / segments));
            const geo = new THREE.CylinderGeometry(rTop, rBottom, segmentHeight, 4); 
            const mesh = new THREE.Mesh(geo, i % 2 === 0 ? towerMatRed : towerMatWhite);
            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, towerEdgeMat);
            mesh.add(line);
            mesh.position.y = (i * segmentHeight) + (segmentHeight / 2) - (height / 2);
            mesh.rotation.y = Math.PI / 4; 
            towerGroup.add(mesh);
        }
        const dishGeo = new THREE.CylinderGeometry(height * 0.04, height * 0.02, height * 0.02, 8);
        const dish1 = new THREE.Mesh(dishGeo, dishMat); dish1.rotation.x = Math.PI / 2; dish1.position.set(height * 0.03, (height / 2) - (height * 0.15), height * 0.03); towerGroup.add(dish1);
        const dish2 = new THREE.Mesh(dishGeo, dishMat); dish2.rotation.x = Math.PI / 2; dish2.rotation.z = Math.PI / 2; dish2.position.set(-height * 0.03, (height / 2) - (height * 0.25), -height * 0.03); towerGroup.add(dish2);
        return towerGroup;
    }

    function generateMapPins() {

                mapPinsGroup.add(tower2); mapPinsGroup.add(sprite2); flagHitboxes.push(sprite2);

                const tower3 = createAntennaTower(60); tower3.position.set(pos.x - 50, 30, pos.z + 50);

    function onPointerDown(event) {
        if(appState !== 'MAP') return;
        
        let currentTime = new Date().getTime();
        let tapLength = currentTime - lastTapTime;
        lastTapTime = currentTime;

        if(tapLength < 400 && tapLength > 0) {
            let clientX = event.touches ? event.touches[0].clientX : event.clientX;
            let clientY = event.touches ? event.touches[0].clientY : event.clientY;
            
            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;
            
            raycaster.setFromCamera(mouse, camera);
            
            const intersects = raycaster.intersectObjects(flagHitboxes);
            if (intersects.length > 0) {
                const tappedData = intersects[0].object.userData;
                
                if (tappedData.type === 'booklet') {
                    openBooklet(tappedData.islandIndex);
                }
                else if (tappedData.type === 'worksheet') {
                    if (!readBooklets[tappedData.islandIndex]) {
                        showToast("📖 Read the Blue Booklet first to learn the answers!");
                    } else {
                        startWorksheet(tappedData.islandIndex);
                    }
                } 
                else if (tappedData.type === 'driving') {
                    if (islandStates[tappedData.islandIndex] === 0) {
                        showToast("Complete the 📝 Worksheet first to unlock this island!");
                    } else {
                        startDrivingGame(tappedData.islandIndex);
                    }
                }
            }
        }
    }

    function createSignText(text, color) {
        const c = document.createElement('canvas'); const ctx = c.getContext('2d');
        const canvasWidth = 1024; const fontSize = 64;
        ctx.font = `bold ${fontSize}px 'Faruma', 'MV Boli', 'Noto Sans Thaana'`;
        const words = text.split(' '); let lines = []; let currentLine = words[0] || "";
        for (let i = 1; i < words.length; i++) {
            const testLine = currentLine + " " + words[i];
            if (ctx.measureText(testLine).width < canvasWidth - 120) { currentLine = testLine; } else { lines.push(currentLine); currentLine = words[i]; }  
        } lines.push(currentLine);
        const canvasHeight = Math.max(512, (lines.length * (fontSize + 30)) + 120); c.width = canvasWidth; c.height = canvasHeight;
        ctx.fillStyle = color; ctx.fillRect(0, 0, c.width, c.height); ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl"; ctx.font = `bold ${fontSize}px 'Faruma', 'MV Boli', 'Noto Sans Thaana'`;
        const startY = (c.height / 2) - (((lines.length - 1) * (fontSize + 30)) / 2);
        lines.forEach((line, index) => { ctx.fillText(line, c.width / 2, startY + (index * (fontSize + 30))); });
        return { tex: new THREE.CanvasTexture(c), color: color, w: 24, h: (canvasHeight / canvasWidth) * 24 };
    }

    function getSafeBoardPosition() {
        let pos = {x: 0, z: 0}; let safe = false;
        while (!safe) { 
            pos.x = (Math.random() - 0.5) * 220; pos.z = (Math.random() - 0.5) * 220;
            if (Math.abs(pos.x) < 40 && Math.abs(pos.z) < 40) continue; 
            safe = true;
            for (let b of signboardsArray) { if (Math.hypot(pos.x - b.mesh.position.x, pos.z - b.mesh.position.z) < 40) { safe = false; break; } }
        } return pos;
    }

        for(let i = 0; i < answerSet.length && i < 10; i++) {
            let color = signColors[i % signColors.length]; let pos = getSafeBoardPosition();

    function spawnBoard(text, color, qIndex, xPos, zPos) {
        const signData = createSignText(text, color); const g = new THREE.Group();
        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 10), new THREE.MeshStandardMaterial({color: 0x333333})); p.position.y = 5; g.add(p);
        const boxMat = new THREE.MeshStandardMaterial({color: color}); const b = new THREE.Mesh(new THREE.BoxGeometry(signData.w, signData.h, 1.0), boxMat); b.position.set(0, 10 + (signData.h/2 - 5), 0); g.add(b);
        const textMat = new THREE.MeshStandardMaterial({map: signData.tex});
        const frontFace = new THREE.Mesh(new THREE.PlaneGeometry(signData.w, signData.h), textMat); frontFace.position.set(0, 10 + (signData.h/2 - 5), 0.51); g.add(frontFace);
        const backFace = new THREE.Mesh(new THREE.PlaneGeometry(signData.w, signData.h), textMat); backFace.position.set(0, 10 + (signData.h/2 - 5), -0.51); backFace.rotation.y = Math.PI; g.add(backFace);
        g.position.set(xPos, 0, zPos); gameGroup.add(g); signboardsArray.push({ mesh: g, qIndex: qIndex });
    }

    function handleInteractionStart(e) {
        if(appState !== 'PLAYING') return; 
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return; 
        if (!isPaused) {
            isDriving = true; document.getElementById('tap-indicator').style.display = 'none'; 
            let clientX = e.touches ? e.touches[0].clientX : e.clientX; let clientY = e.touches ? e.touches[0].clientY : e.clientY; let screenW = window.innerWidth;
            if (clientX < screenW * 0.3) { activeSteering = 1; } else if (clientX > screenW * 0.7) { activeSteering = -1; } else { isLooking = true; lookStartX = clientX; lookStartY = clientY; }
        }
    }
    
    function handleInteractionMove(e) {
        if(appState !== 'PLAYING') return; if (e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
        if (!isPaused && isLooking) {
            let clientX = e.touches ? e.touches[0].clientX : e.clientX; let clientY = e.touches ? e.touches[0].clientY : e.clientY;
            targetCamAngleOffset = -((clientX - lookStartX) / window.innerWidth) * Math.PI * 1.5; 
            targetCamPitchOffset = -((clientY - lookStartY) / window.innerHeight) * Math.PI; 
        }
    }

    function handleInteractionEnd() { if(appState !== 'PLAYING') return; activeSteering = 0; isLooking = false; targetCamAngleOffset = 0; targetCamPitchOffset = 0; }
    window.addEventListener('touchstart', handleInteractionStart, {passive: false}); window.addEventListener('mousedown', handleInteractionStart); window.addEventListener('touchmove', handleInteractionMove, {passive: false}); window.addEventListener('mousemove', handleInteractionMove); window.addEventListener('touchend', handleInteractionEnd); window.addEventListener('mouseup', handleInteractionEnd);

    function animate() {
        requestAnimationFrame(animate);
        const delta = clock.getDelta(); mixers.forEach(m => m.update(delta)); 
        
        if (appState === 'MAP') { controls.target.y = 0; controls.update(); renderer.render(scene, camera); return; }

        if (appState === 'PLAYING') {
            if (!isPaused) {
                camAngleOffset += (targetCamAngleOffset - camAngleOffset) * 0.1; camPitchOffset += (targetCamPitchOffset - camPitchOffset) * 0.1;
                let speed = parseFloat(document.getElementById('speed-slider').value);
                
                if (audioCtx) updateEngineSound(isDriving, speed);
                
                if (isDriving) {
                    if (activeSteering === 1) carGroup.rotation.y += 0.04; else if (activeSteering === -1) carGroup.rotation.y -= 0.04;

                    const oldPos = carGroup.position.clone(); carGroup.translateZ(-speed);
                    for(let t of treesArray) if(carGroup.position.distanceTo(t.mesh.position) < t.radius) { carGroup.position.copy(oldPos); }
                    if(Math.abs(carGroup.position.x) > BOUNDARY || Math.abs(carGroup.position.z) > BOUNDARY) { carGroup.position.copy(oldPos); }

                    let hitIndex = -1; let correctHit = false;
                    for (let i = 0; i < signboardsArray.length; i++) {
                        let board = signboardsArray[i];
                        if (carGroup.position.distanceTo(board.mesh.position) < 4.5) {
                            if (board.qIndex === currentQuestion) { 
                                hitIndex = i; correctHit = true; break; 
                            } 
                            else { 
                                carGroup.translateZ(15); 
                                isDriving = false; 
                                
                                drivingLives--;
                                document.getElementById('driving-lives').innerText = '❤️'.repeat(Math.max(0, drivingLives));
                                
                                if (drivingLives <= 0) {
                                    clearInterval(timerInterval);
                                    document.getElementById('top-left-stats').style.display = 'none';
                                    showWrongAnswerUI(true); 
                                    showToast("💀 Game Over! Too many wrong boards.");
                                    setTimeout(() => { openMap(currentIsland); }, 2000);
                                } else {
                                    document.getElementById('tap-indicator').style.display = 'block'; 
                                    showWrongAnswerUI(false); 
                                }
                                break; 
                            }
                        }
                    }

                    if (correctHit) { gameGroup.remove(signboardsArray[hitIndex].mesh); signboardsArray.splice(hitIndex, 1); currentQuestion++; updateQuestionUI(); }
                }

                const cy = carGroup.rotation.y + camAngleOffset; 
                if (cameraMode === 0) {
                    const mPitch = 0.3; 
                    camera.position.lerp(new THREE.Vector3(carGroup.position.x + 25 * Math.sin(cy) * Math.cos(mPitch), carGroup.position.y + 22 * Math.sin(mPitch) + 4, carGroup.position.z + 25 * Math.cos(cy) * Math.cos(mPitch)), 0.1);
                    let lookY = carGroup.position.y + 1 + (camPitchOffset * 40); camera.lookAt(carGroup.position.x - 20 * Math.sin(cy), lookY, carGroup.position.z - 20 * Math.cos(cy));
                } else if (cameraMode === 1) {
                    camera.position.lerp(new THREE.Vector3(carGroup.position.x + 40 * Math.sin(cy), carGroup.position.y + 50, carGroup.position.z + 40 * Math.cos(cy)), 0.1);
                    camera.lookAt(carGroup.position.x - 20 * Math.sin(cy), carGroup.position.y, carGroup.position.z - 20 * Math.cos(cy));
                } else if (cameraMode === 2) {
                    const time = Date.now() * 0.0005; camera.position.lerp(new THREE.Vector3(carGroup.position.x + 40 * Math.sin(time), carGroup.position.y + 20, carGroup.position.z + 40 * Math.cos(time)), 0.1);
                    camera.lookAt(carGroup.position.x, carGroup.position.y + 2, carGroup.position.z);
                }
            } else { controls.update(); }
            renderer.render(scene, camera);
        }
    }
  </script>
