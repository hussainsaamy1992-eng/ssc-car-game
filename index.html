<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <title>3D Island Drive - SSC Islam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <!-- Load 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  
  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #87CEEB; touch-action: none; font-family: Arial, sans-serif; }
    canvas { display: block; width: 100vw; height: 100vh; }
    
    #ui-container { position: absolute; top: 15px; width: 100%; color: white; text-shadow: 2px 2px 4px black; z-index: 10; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
    #trophy { background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 20px; font-size: 18px; font-weight: bold; margin-bottom: 10px; color: gold; border: 1px solid gold;}
    #question-box { background: rgba(255,255,255,0.95); color: black; padding: 15px; border-radius: 10px; font-size: 20px; font-weight: bold; text-align: center; border: 3px solid #333; text-shadow: none; direction: rtl; width: 85%; max-width: 600px; box-shadow: 0px 4px 8px rgba(0,0,0,0.3);}
    
    #loading-screen { position: absolute; width: 100%; height: 100%; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 100; color: white; font-size: 24px; text-align: center; padding: 20px; }
  </style>
</head>
<body>

  <!-- Loading Screen -->
  <div id="loading-screen">
    Loading 3D World & Questions...
    <br>
    <span style="font-size: 16px; margin-top: 15px; color: #aaa;">Please wait</span>
  </div>

  <!-- Game UI Overlay -->
  <div id="ui-container" style="display: none;">
    <div id="trophy" dir="ltr">🏆 Island <span id="island-counter">1 / 50</span></div>
    <div id="question-box">Loading...</div>
  </div>

  <script>
    // ==========================================
    // API CONNECTION
    // ==========================================
    const API_URL = "https://script.google.com/macros/s/AKfycbydQNgQncy4isjzbMa-DlaaDAbt3TPFv39yYG0nA7p6oDn1a8DFXrSNRlDfAFd4FSUu/exec"; 

    // --- Game Variables ---
    let gameData = [];
    let currentIsland = 0;
    let currentQuestion = 0;
    
    // --- 3D Engine Setup ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); // Sky blue
    
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.0); 
    sun.position.set(100, 200, 100); 
    scene.add(sun);

    // --- Load Models ---
    const carGroup = new THREE.Group(); 
    scene.add(carGroup);
    const signboardsArray = [];
    const gltfLoader = new THREE.GLTFLoader();

    async function initGame() {
        try {
            // 1. Fetch questions from your exact Google Sheet URL
            const res = await fetch(`${API_URL}?action=getGameData`);
            const data = await res.json();
            
            if (data.success && data.islands.length > 0) {
                gameData = data.islands;
            } else {
                document.getElementById('loading-screen').innerHTML = "Error: No questions found in Sheet1.";
                return;
            }

            // 2. Load Grass Floor
            const tex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping; 
            tex.repeat.set(50, 50);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(800, 800), new THREE.MeshStandardMaterial({map: tex}));
            ground.rotation.x = -Math.PI/2; 
            scene.add(ground);

            // 3. Load 3D Car (From your old game assets)
            gltfLoader.load('https://hussainsaamy.github.io/game-assets/Sports%20Car.glb', (gltf) => {
                const myCar = gltf.scene;
                myCar.scale.set(4, 4, 4);
                myCar.rotation.y = Math.PI; // Face forward
                carGroup.add(myCar);
                
                // Hide loader and show game UI
                document.getElementById('loading-screen').style.display = 'none';
                document.getElementById('ui-container').style.display = 'flex';
                
                loadQuestionUI();
                animate();
            }, undefined, function (error) {
                console.error(error);
                document.getElementById('loading-screen').innerHTML = "Error loading 3D Car. Check assets.";
            });

        } catch (error) {
            document.getElementById('loading-screen').innerHTML = "Error connecting to Google Sheet.<br>Make sure you have an internet connection.";
        }
    }

    // --- Create 3D Wooden Signboards with Dhivehi Text ---
    function createSignText(text, isCorrect) {
        const c = document.createElement('canvas'); 
        const ctx = c.getContext('2d');
        c.width = 1024; 
        c.height = 512;
        
        // Wooden board background color
        ctx.fillStyle = "#8b5a2b"; 
        ctx.fillRect(0, 0, c.width, c.height);
        
        // Dhivehi Text formatting
        ctx.fillStyle = "white"; 
        ctx.textAlign = "center"; 
        ctx.textBaseline = "middle"; 
        ctx.direction = "rtl"; 
        ctx.font = `bold 60px Arial`; 
        
        // Write the answer in the middle of the canvas
        ctx.fillText(text, c.width / 2, c.height / 2); 
        
        const tex = new THREE.CanvasTexture(c); 
        const m = new THREE.MeshStandardMaterial({color: 0xffffff});
        const mFace = new THREE.MeshStandardMaterial({map: tex});
        
        // Return 6 sides of the cube, face gets the canvas texture
        return { mats: [m, m, m, m, mFace, m], isCorrect: isCorrect };
    }

    function loadQuestionUI() {
        // Clear old 3D boards from the scene
        signboardsArray.forEach(b => scene.remove(b.mesh));
        signboardsArray.length = 0;

        // Fetch current question
        let qData = gameData[currentIsland][currentQuestion];
        
        // Update top UI
        document.getElementById('question-box').innerText = qData.question;
        document.getElementById('island-counter').innerText = `${currentIsland + 1} / 50`;

        // Randomly place the correct answer Left or Right
        let isLeftCorrect = Math.random() < 0.5;

        // Spawn left board (x: -30) and right board (x: 30), way down the road (z: -120)
        spawnBoard(isLeftCorrect ? qData.correctAnswer : "ނުބައި ޖަވާބު", isLeftCorrect, -30, -120);
        spawnBoard(!isLeftCorrect ? qData.correctAnswer : "ނުބައި ޖަވާބު", !isLeftCorrect, 30, -120);
    }

    function spawnBoard(text, isCorrect, xPos, zPos) {
        const signData = createSignText(text, isCorrect);
        const g = new THREE.Group();
        
        // Wooden Pole
        const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 10), new THREE.MeshStandardMaterial({color: 0x333333})); 
        pole.position.y = 5; 
        g.add(pole);
        
        // Main Board Box
        const board = new THREE.Mesh(new THREE.BoxGeometry(24, 12, 2), signData.mats); 
        board.position.set(0, 10, 1); 
        g.add(board);
        
        // Position board in the 3D world
        g.position.set(xPos, 0, zPos);
        scene.add(g);
        signboardsArray.push({ mesh: g, isCorrect: isCorrect });
    }

    // --- Mobile Touch Controls ---
    let speed = 0;
    let isTouching = false;
    let touchX = 0;

    window.addEventListener('touchstart', (e) => { isTouching = true; touchX = e.touches[0].clientX; });
    window.addEventListener('touchmove', (e) => { touchX = e.touches[0].clientX; });
    window.addEventListener('touchend', () => { isTouching = false; });
    
    // Fallback for computer mouse testing
    window.addEventListener('mousedown', (e) => { isTouching = true; touchX = e.clientX; });
    window.addEventListener('mousemove', (e) => { if(isTouching) touchX = e.clientX; });
    window.addEventListener('mouseup', () => { isTouching = false; });

    // --- Core 3D Game Loop ---
    function animate() {
        requestAnimationFrame(animate);
        
        // Auto Drive Forward continuously
        speed = 1.0;
        
        // Steering logic
        if (isTouching) {
            if (touchX < window.innerWidth / 2) { 
                carGroup.rotation.y += 0.04; // Steer Left
            } else { 
                carGroup.rotation.y -= 0.04; // Steer Right
            }
        }

        // Push car forward in the direction it's facing
        carGroup.translateZ(-speed);
        
        // 3rd Person Camera - Follow the car dynamically
        const cy = carGroup.rotation.y;
        camera.position.lerp(new THREE.Vector3(
            carGroup.position.x + 30 * Math.sin(cy), 
            carGroup.position.y + 12, 
            carGroup.position.z + 30 * Math.cos(cy)
        ), 0.1);
        camera.lookAt(carGroup.position.x, carGroup.position.y + 2, carGroup.position.z);

        // Check for collisions with boards
        signboardsArray.forEach((board) => {
            if (carGroup.position.distanceTo(board.mesh.position) < 10) {
                if (board.isCorrect) {
                    // Correct Answer Hit!
                    currentQuestion++;
                    carGroup.position.set(0,0,0);
                    carGroup.rotation.set(0,0,0);
                    
                    // Check if 10 questions are finished (Island completed)
                    if (currentQuestion >= 10) {
                        currentIsland++;
                        currentQuestion = 0;
                        
                        if (currentIsland >= 50) {
                            currentIsland = 0; // Restart from beginning if 500 questions beaten!
                        }
                    }
                    loadQuestionUI();
                } else {
                    // Wrong answer! Bounce the car back
                    carGroup.translateZ(15); 
                }
            }
        });

        renderer.render(scene, camera);
    }

    // Trigger Game Start
    initGame();
  </script>
</body>
</html>
