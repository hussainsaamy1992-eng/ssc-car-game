<!DOCTYPE html>
<html lang="dv" dir="rtl">
<head>
  <title>3D Island Drive - SSC Islam</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <!-- Load 3D Engine & Loaders -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/utils/SkeletonUtils.js"></script>
  
  <!-- Fonts exactly from your old game -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thaana:wght@700&display=swap" rel="stylesheet">

  <style>
    body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #1a1a1a; touch-action: none; font-family: 'Faruma', 'MV Boli', 'Noto Sans Thaana', sans-serif !important; }
    canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }
    
    #ui-container { position: absolute; top: 15px; width: 100%; color: white; text-shadow: 2px 2px 4px black; z-index: 100; display: flex; flex-direction: column; align-items: center; pointer-events: none; }
    #trophy { background: rgba(0,0,0,0.8); padding: 5px 20px; border-radius: 20px; font-size: 18px; font-weight: bold; margin-bottom: 10px; color: gold; border: 1px solid gold;}
    #question-box { background: rgba(255,255,255,0.95); color: black; padding: 15px; border-radius: 10px; font-size: 24px; font-weight: bold; text-align: center; border: 3px solid #333; text-shadow: none; direction: rtl; width: 85%; max-width: 600px; box-shadow: 0px 4px 8px rgba(0,0,0,0.3);}
    
    #loading-screen { position: absolute; width: 100%; height: 100%; background: #1a1a1a; display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 200; color: white; font-size: 24px; text-align: center; padding: 20px; }
    #start-btn { display: none; margin-top: 20px; padding: 12px 40px; font-size: 22px; background: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; font-family: inherit; }
    
    /* PAUSE BUTTON FIXED: High Z-Index ensures it stays on top */
    #pause-btn { position: absolute; bottom: 20px; right: 20px; padding: 15px 20px; font-size: 18px; background: #e74c3c; color: white; border: 3px solid #c0392b; border-radius: 10px; cursor: pointer; font-weight: bold; z-index: 9999; display: none; box-shadow: 0px 4px 8px rgba(0,0,0,0.5); font-family: Arial, sans-serif; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <span id="load-text" style="color: #4CAF50; font-size: 30px;">Building Island...</span>
    <button id="start-btn" onclick="startGameEngine()">START ENGINE</button>
  </div>

  <div id="ui-container" style="display: none;">
    <div id="trophy" dir="ltr">🏆 Island <span id="island-counter">1 / 50</span></div>
    <div id="question-box">Loading...</div>
  </div>

  <!-- Pause Button -->
  <button id="pause-btn" onclick="togglePause()" dir="ltr">⏸ PAUSE</button>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbydQNgQncy4isjzbMa-DlaaDAbt3TPFv39yYG0nA7p6oDn1a8DFXrSNRlDfAFd4FSUu/exec"; 

    let gameData = [];
    let currentIsland = 0;
    let currentQuestion = 0;
    let gameStarted = false;
    let isPaused = false; 
    let MAP_SIZE = 400, BOUNDARY = 190;
    
    // Audio Variables Restored
    let engineAudio, bullAudio;
    
    const signColors = ["#1B5E20", "#0D47A1", "#B71C1C", "#4A148C", "#E65100", "#006064", "#212121"];
    
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87CEEB); 
    const clock = new THREE.Clock();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth/window.innerHeight, 0.1, 5000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.AmbientLight(0xffffff, 0.9));
    const sun = new THREE.DirectionalLight(0xffffff, 1.0); sun.position.set(100, 200, 100); scene.add(sun);

    const carGroup = new THREE.Group(); scene.add(carGroup);
    const signboardsArray = [], treesArray = [], bullsArray = [], mixers = [];
    const gltfLoader = new THREE.GLTFLoader();

    function loadModel(url) { return new Promise(res => gltfLoader.load(url, res, undefined, () => res(null))); }

    async function initAssets() {
        try {
            const res = await fetch(`${API_URL}?action=getGameData`);
            const data = await res.json();
            if (data.success) gameData = data.islands;

            const tex = new THREE.TextureLoader().load('https://threejs.org/examples/textures/terrain/grasslight-big.jpg');
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping; tex.repeat.set(50, 50);
            const ground = new THREE.Mesh(new THREE.PlaneGeometry(MAP_SIZE+200, MAP_SIZE+200), new THREE.MeshStandardMaterial({map: tex}));
            ground.rotation.x = -Math.PI/2; scene.add(ground);

            const [carG, t1, t2, f1, bullG, fenceG] = await Promise.all([
                loadModel('https://hussainsaamy.github.io/game-assets/Sports%20Car.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Tree.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Tree2.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Flowers.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Bull.glb'),
                loadModel('https://hussainsaamy.github.io/game-assets/Fence.glb')
            ]);

            if(carG) {
                const myCar = carG.scene;
                myCar.scale.set(4, 4, 4); myCar.rotation.y = Math.PI;
                carGroup.add(myCar);
            }

            if(t1) for(let i=0; i<15; i++) spawnDeco(t1.scene, 5, 7, treesArray);
            if(t2) for(let i=0; i<15; i++) spawnDeco(t2.scene, 5, 7, treesArray);
            if(f1) for(let i=0; i<40; i++) spawnDeco(f1.scene, 2, 0, null);

            if(bullG) { 
                [60, -60].forEach(x => { 
                    const b = THREE.SkeletonUtils.clone(bullG.scene); 
                    b.position.set(x, 0, -80); b.scale.set(6,6,6); scene.add(b); 
                    bullsArray.push({mesh:b, radius:12}); 
                    if(bullG.animations.length){ 
                        const m = new THREE.AnimationMixer(b); 
                        m.clipAction(bullG.animations[0]).play(); mixers.push(m); 
                    }
                }); 
            }

            if(fenceG) {
                const h = MAP_SIZE/2;
                for(let i=-h; i<=h; i+=15){ 
                    addF(fenceG.scene, i, -h, 0); addF(fenceG.scene, i, h, 0); 
                    addF(fenceG.scene, h, i, Math.PI/2); addF(fenceG.scene, -h, i, Math.PI/2); 
                }
            }

            document.getElementById('load-text').innerText = "World Ready!";
            document.getElementById('start-btn').style.display = 'block';

        } catch (error) {
            document.getElementById('load-text').innerHTML = "Error connecting.";
        }
    }

    function spawnDeco(m, s, r, arr) {
        const d = m.clone(); 
        const x = (Math.random()-0.5)*MAP_SIZE, z = (Math.random()-0.5)*MAP_SIZE;
        if(Math.abs(x)<60 && Math.abs(z)<60) return; 
        d.position.set(x, 0, z); d.scale.set(s,s,s); scene.add(d); 
        if(arr) arr.push({mesh:d, radius:r});
    }

    function addF(m, x, z, r) { 
        const f = m.clone(); f.position.set(x,0,z); f.rotation.y=r; f.scale.set(5, 12, 5); scene.add(f); 
    }

    function startGameEngine() {
        document.getElementById('loading-screen').style.display = 'none';
        document.getElementById('ui-container').style.display = 'flex';
        document.getElementById('pause-btn').style.display = 'block'; 
        
        // AUDIO RESTORED
        engineAudio = new Audio('https://hussainsaamy.github.io/game-assets/sound.mp3'); 
        engineAudio.loop = true; 
        engineAudio.play().catch(()=>{});
        
        bullAudio = new Audio('https://hussainsaamy.github.io/game-assets/bull.mp3'); 
        bullAudio.loop = true; 
        bullAudio.volume = 0; 
        bullAudio.play().catch(()=>{});

        gameStarted = true;
        loadQuestionUI();
        animate();
    }

    function togglePause() {
        isPaused = !isPaused;
        const btn = document.getElementById('pause-btn');
        if (isPaused) {
            btn.innerText = "▶ RESUME";
            btn.style.background = "#27ae60"; 
            btn.style.borderColor = "#2ecc71";
            if (engineAudio) engineAudio.volume = 0; // Mute engine when paused
        } else {
            btn.innerText = "⏸ PAUSE";
            btn.style.background = "#e74c3c"; 
            btn.style.borderColor = "#c0392b";
            if (engineAudio) engineAudio.volume = 1; // Unmute engine when resumed
        }
    }

    function createSignText(text, color, isCorrect) {
        const c = document.createElement('canvas'); const ctx = c.getContext('2d');
        const canvasWidth = 1024; const fontSize = 64;
        ctx.font = `bold ${fontSize}px 'Faruma', 'MV Boli', 'Noto Sans Thaana'`;
        
        const words = text.split(' '); let lines = []; let currentLine = words[0] || "";
        for (let i = 1; i < words.length; i++) {
            const testLine = currentLine + " " + words[i];
            if (ctx.measureText(testLine).width < canvasWidth - 120) { currentLine = testLine; } 
            else { lines.push(currentLine); currentLine = words[i]; }  
        }
        lines.push(currentLine);
        
        const canvasHeight = Math.max(512, (lines.length * (fontSize + 30)) + 120);
        c.width = canvasWidth; c.height = canvasHeight;
        
        ctx.fillStyle = color; ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = "white"; ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.direction = "rtl"; 
        ctx.font = `bold ${fontSize}px 'Faruma', 'MV Boli', 'Noto Sans Thaana'`;
        
        const startY = (c.height / 2) - (((lines.length - 1) * (fontSize + 30)) / 2);
        lines.forEach((line, index) => { ctx.fillText(line, c.width / 2, startY + (index * (fontSize + 30))); });
        
        const tex = new THREE.CanvasTexture(c); const m = new THREE.MeshStandardMaterial({color: color});
        return { mats: [m, m, m, m, new THREE.MeshStandardMaterial({map: tex}), m], w: 24, h: (canvasHeight / canvasWidth) * 24, isCorrect: isCorrect };
    }

    function loadQuestionUI() {
        signboardsArray.forEach(b => scene.remove(b.mesh));
        signboardsArray.length = 0;

        carGroup.position.set(0,0,0);
        carGroup.rotation.set(0,0,0);

        let qData = gameData[currentIsland][currentQuestion];
        document.getElementById('question-box').innerText = qData.question;
        document.getElementById('island-counter').innerText = `${currentIsland + 1} / 50`;

        let isLeftCorrect = Math.random() < 0.5;
        let c1 = signColors[Math.floor(Math.random() * signColors.length)];
        let c2 = signColors[(signColors.indexOf(c1) + 1) % signColors.length];

        spawnBoard(isLeftCorrect ? qData.correctAnswer : "ނުބައި ޖަވާބު", c1, isLeftCorrect, -30, -120);
        spawnBoard(!isLeftCorrect ? qData.correctAnswer : "ނުބައި ޖަވާބު", c2, !isLeftCorrect, 30, -120);
    }

    function spawnBoard(text, color, isCorrect, xPos, zPos) {
        const signData = createSignText(text, color, isCorrect);
        const g = new THREE.Group();
        const p = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 10), new THREE.MeshStandardMaterial({color: 0x333333})); p.position.y = 5; g.add(p);
        const b = new THREE.Mesh(new THREE.BoxGeometry(signData.w, signData.h, 2.5), signData.mats); b.position.set(0, 10 + (signData.h/2 - 5), 1.2); g.add(b);
        g.position.set(xPos, 0, zPos); scene.add(g);
        signboardsArray.push({ mesh: g, isCorrect: isCorrect });
    }

    // Controls
    let speed = 0, isTouching = false, touchX = 0;
    window.addEventListener('touchstart', (e) => { if(!isPaused) { isTouching = true; touchX = e.touches[0].clientX; }});
    window.addEventListener('touchmove', (e) => { if(!isPaused) { touchX = e.touches[0].clientX; }});
    window.addEventListener('touchend', () => { isTouching = false; });
    window.addEventListener('mousedown', (e) => { if(!isPaused) { isTouching = true; touchX = e.clientX; }});
    window.addEventListener('mousemove', (e) => { if(isTouching && !isPaused) touchX = e.clientX; });
    window.addEventListener('mouseup', () => { isTouching = false; });

    function animate() {
        if(!gameStarted) return;
        requestAnimationFrame(animate);
        
        if (!isPaused) {
            const delta = clock.getDelta(); 
            mixers.forEach(m => m.update(delta)); 
            
            speed = 1.0;
            if (isTouching) {
                if (touchX < window.innerWidth / 2) carGroup.rotation.y += 0.04;
                else carGroup.rotation.y -= 0.04;
            }

            const oldPos = carGroup.position.clone();
            carGroup.translateZ(-speed);

            for(let t of treesArray) if(carGroup.position.distanceTo(t.mesh.position) < t.radius) { carGroup.position.copy(oldPos); }
            for(let b of bullsArray) if(carGroup.position.distanceTo(b.mesh.position) < b.radius) { carGroup.position.copy(oldPos); }
            if(Math.abs(carGroup.position.x) > BOUNDARY || Math.abs(carGroup.position.z) > BOUNDARY) { carGroup.position.copy(oldPos); }

            // Audio Logic Restored
            if(bullAudio) { 
                let mD = 1000; 
                bullsArray.forEach(b => { 
                    let d = carGroup.position.distanceTo(b.mesh.position); 
                    if(d < mD) mD = d; 
                }); 
                bullAudio.volume = Math.max(0, 1 - (mD / 120)); 
            }

            const cy = carGroup.rotation.y;
            const mPitch = 0.3; 
            camera.position.lerp(new THREE.Vector3(
                carGroup.position.x + 25 * Math.sin(cy) * Math.cos(mPitch), 
                carGroup.position.y + 22 * Math.sin(mPitch) + 4, 
                carGroup.position.z + 25 * Math.cos(cy) * Math.cos(mPitch)
            ), 0.1);
            camera.lookAt(carGroup.position.x, carGroup.position.y + 1, carGroup.position.z);

            signboardsArray.forEach((board) => {
                if (carGroup.position.distanceTo(board.mesh.position) < 8) {
                    if (board.isCorrect) {
                        currentQuestion++;
                        if (currentQuestion >= 10) {
                            currentIsland++;
                            currentQuestion = 0;
                            if (currentIsland >= 50) currentIsland = 0; 
                        }
                        loadQuestionUI();
                    } else {
                        carGroup.translateZ(15);
                    }
                }
            });
        }

        renderer.render(scene, camera);
    }

    initAssets();
  </script>
</body>
</html>
